<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenAI Visual Course — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-container{background:#12121f;border:1px solid #222;border-radius:16px;padding:3rem;max-width:420px;width:100%;text-align:center}
h1{font-size:1.8rem;margin-bottom:.5rem;background:linear-gradient(90deg,#00d2ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#666;font-size:.9rem;margin-bottom:2rem}
.input-group{margin-bottom:1.5rem;text-align:left}
.input-group label{display:block;font-size:.85rem;color:#888;margin-bottom:.5rem}
.input-group input{width:100%;padding:12px 16px;background:#0a0a14;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:1rem;outline:none;transition:border-color .3s}
.input-group input:focus{border-color:#7b2ff7}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#7b2ff7,#00d2ff);color:white;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .3s}
.btn:hover{opacity:.9}
.error{color:#ff6b6b;font-size:.85rem;margin-top:1rem;display:none}
.lock-icon{font-size:3rem;margin-bottom:1rem}
.remember{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
.remember input[type=checkbox]{accent-color:#7b2ff7}
.remember label{font-size:.85rem;color:#888;cursor:pointer}
</style>
</head>
<body>
<div class="login-container">
<div class="lock-icon">🔐</div>
<h1>GenAI Visual Course</h1>
<p class="subtitle">Private learning materials — access code required</p>
<form id="loginForm">
<div class="input-group">
<label for="accessCode">Access Code</label>
<input type="password" id="accessCode" placeholder="Enter your access code" autocomplete="off">
</div>
<div class="remember">
<input type="checkbox" id="rememberMe" checked>
<label for="rememberMe">Remember me on this device</label>
</div>
<button type="submit" class="btn">Unlock Course →</button>
</form>
<p class="error" id="errorMsg">❌ Invalid access code. Try again.</p>
</div>
<script>
// Check if already authenticated with current version
const stored = localStorage.getItem('genai_course_auth');
const storedVersion = localStorage.getItem('genai_auth_version');
if (stored === 'authenticated' && storedVersion === '4') {
    window.location.href = 'index.html';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const code = document.getElementById('accessCode').value;
    const remember = document.getElementById('rememberMe').checked;
    
    // Validate: encode input to base64 and compare
    const encoded = btoa(code);
    const valid = 'TmV3MDEwMUAwMTAx';
    
    if (encoded === valid) {
        if (remember) {
            localStorage.setItem('genai_course_auth', 'authenticated');
            localStorage.setItem('genai_auth_version', '4');
        } else {
            sessionStorage.setItem('genai_course_auth', 'authenticated');
            sessionStorage.setItem('genai_auth_version', '4');
        }
        window.location.href = 'index.html';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('accessCode').value = '';
        document.getElementById('accessCode').style.borderColor = '#ff6b6b';
        setTimeout(() => {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('accessCode').style.borderColor = '#333';
        }, 3000);
    }
});
</script>
</body>
</html>
